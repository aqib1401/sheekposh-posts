name: Sync catalogue

on:
  schedule:
    - cron: "17 5 * * *"   # 10:17 AM Pakistan time, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_catalog.py
      - .github/workflows/sync-catalog.yml

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch catalogue and photos
        run: |
          pip install --quiet pillow
          python scripts/sync_catalog.py

      - name: Commit changes
        run: |
          git config user.name "sheekposh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalog
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Catalogue sync $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
